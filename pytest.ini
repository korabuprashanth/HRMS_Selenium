[pytest]
# ── where to look for tests ───────────────────────────────────────
testpaths = Tests

# ── output style ─────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html

# ── test file / function naming pattern ──────────────────────────
python_files  = test_*.py
python_classes = Test*
python_functions = test_*
